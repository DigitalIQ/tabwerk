<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gesperrt im Fokus</title>
  <link rel="stylesheet" href="../ui/base.css">
  <style>
    html, body { height: 100%; }
    body { display: grid; place-items: center; padding: 16px; }
    main { max-width: 440px; display: grid; gap: 14px; text-align: center; justify-items: center; }
    .time { font: 600 44px/1 var(--mono); letter-spacing: -0.02em; }
    h1 { margin: 0; font-size: 20px; font-weight: 650; }
    p { margin: 0; color: var(--ink-2); }
    .site { font-family: var(--mono); font-size: 12.5px; color: var(--ink-3); word-break: break-all; }
    .row-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  </style>
</head>
<body>
  <main>
    <div class="time" id="left" aria-live="polite"></div>
    <h1>Diese Seite wartet bis nach dem Fokus.</h1>
    <p class="site" id="site"></p>
    <div class="row-actions">
      <button class="primary" id="back">Zurück</button>
      <button id="once">Trotzdem öffnen</button>
      <button class="ghost" id="end">Fokus beenden</button>
    </div>
  </main>
  <script type="module" src="blocked.js"></script>
</body>
</html>
