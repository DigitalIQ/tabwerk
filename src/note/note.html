<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notiz</title>
  <link rel="stylesheet" href="../ui/base.css">
  <style>
    html, body { background: var(--surface); height: 100%; }
    body { padding: 16px 18px; display: grid; grid-template-rows: auto auto 1fr auto; gap: 10px; }
    header { display: flex; align-items: center; gap: 10px; }
    h1 { margin: 0; font-size: 15px; font-weight: 650; }
    .page { display: grid; grid-template-columns: 16px 1fr; gap: 8px; align-items: center; font-size: 12.5px; color: var(--ink-2); }
    .page span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    textarea { height: 100%; min-height: 120px; resize: none; font-size: 14px; }
    .bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  </style>
</head>
<body>
  <header><img src="/icons/icon32.png" alt="" width="20" height="20"><h1>Notiz zum Tab</h1></header>
  <div class="page" id="page"></div>
  <label class="visually-hidden" for="text">Notiz</label>
  <textarea id="text" placeholder="Worum ging es hier? Was ist noch offen?"></textarea>
  <div class="bar">
    <span class="help mono" id="hint">⌘↵ speichert</span>
    <span>
      <button class="ghost danger" id="remove" hidden>Löschen</button>
      <button class="primary" id="save">Speichern</button>
    </span>
  </div>
  <script type="module" src="note.js"></script>
</body>
</html>
